# Unitree H1 joint configuration used by robot_cloning.
#
# NOTE: joint names / limits below are the standard H1 URDF values as I know them. They are
# NOT verified against your cloned URDF automatically at design time; at launch time
# scripts/make_h1_gz_urdf.py (urdf_tools.py) re-reads the REAL joint list and limits from
# the URDF into generated/h1_joint_info.yaml, which takes priority over default_limits here.

pelvis_height: 1.05          # metres; the pelvis is rigidly fixed to the world at this height

joint_order:                 # expected H1 movable joints (19 DoF)
  - left_hip_yaw_joint
  - left_hip_roll_joint
  - left_hip_pitch_joint
  - left_knee_joint
  - left_ankle_joint
  - right_hip_yaw_joint
  - right_hip_roll_joint
  - right_hip_pitch_joint
  - right_knee_joint
  - right_ankle_joint
  - torso_joint
  - left_shoulder_pitch_joint
  - left_shoulder_roll_joint
  - left_shoulder_yaw_joint
  - left_elbow_joint
  - right_shoulder_pitch_joint
  - right_shoulder_roll_joint
  - right_shoulder_yaw_joint
  - right_elbow_joint

default_limits:              # [lower, upper] rad, fallback only
  left_hip_yaw_joint: [-0.43, 0.43]
  left_hip_roll_joint: [-0.43, 0.43]
  left_hip_pitch_joint: [-3.14, 2.53]
  left_knee_joint: [-0.26, 2.05]
  left_ankle_joint: [-0.87, 0.52]
  right_hip_yaw_joint: [-0.43, 0.43]
  right_hip_roll_joint: [-0.43, 0.43]
  right_hip_pitch_joint: [-3.14, 2.53]
  right_knee_joint: [-0.26, 2.05]
  right_ankle_joint: [-0.87, 0.52]
  torso_joint: [-2.35, 2.35]
  left_shoulder_pitch_joint: [-2.87, 2.87]
  left_shoulder_roll_joint: [-0.34, 3.11]
  left_shoulder_yaw_joint: [-1.3, 4.45]
  left_elbow_joint: [-1.25, 2.61]
  right_shoulder_pitch_joint: [-2.87, 2.87]
  right_shoulder_roll_joint: [-3.11, 0.34]
  right_shoulder_yaw_joint: [-4.45, 1.3]
  right_elbow_joint: [-1.25, 2.61]

# Canonical BC joint -> H1 joint.  h1_target = sign * canonical + offset
# If a limb moves the "wrong way" in Gazebo, just flip `sign` here (no retraining needed).
mapping:
  left_shoulder_abduction:  {joint: left_shoulder_roll_joint,  sign:  1.0, offset: 0.0}
  right_shoulder_abduction: {joint: right_shoulder_roll_joint, sign: -1.0, offset: 0.0}
  left_elbow_flexion:       {joint: left_elbow_joint,          sign:  1.0, offset: 0.0}
  right_elbow_flexion:      {joint: right_elbow_joint,         sign:  1.0, offset: 0.0}
  left_hip_flexion:         {joint: left_hip_pitch_joint,      sign: -1.0, offset: 0.0}
  right_hip_flexion:        {joint: right_hip_pitch_joint,     sign: -1.0, offset: 0.0}
  left_knee_flexion:        {joint: left_knee_joint,           sign:  1.0, offset: 0.0}
  right_knee_flexion:       {joint: right_knee_joint,          sign:  1.0, offset: 0.0}

neutral:                     # joints not driven by BC are held here (rad); default 0
  default: 0.0

controller:
  rate_hz: 50.0
  max_velocity: 2.5          # rad/s rate limit per joint
  smoothing: 0.35            # 0..1 exponential smoothing factor per tick (1 = none)
